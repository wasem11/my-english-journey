name: Deploy mobile web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-family-english.cjs
      - run: node scripts/check-conversations.cjs
      - run: node scripts/check-english-game.cjs
      - run: node scripts/check-map-transitions.cjs
      - run: node scripts/check-hosted.cjs
      - run: node scripts/check-native-session.cjs
      - run: node scripts/check-ava-routing.cjs
      - run: node scripts/check-microphone.cjs
      - run: node scripts/check-rewards.cjs
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
